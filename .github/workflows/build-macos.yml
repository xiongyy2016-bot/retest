name: Build macOS apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'core.py'
      - 'browser_worker.py'
      - 'requirements.txt'
      - '.github/workflows/build-macos.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            label: Intel
          - runner: macos-15
            architecture: arm64
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Build app with packaged browser
        run: |
          BROWSERS="$(python -c 'import pathlib,playwright; print(pathlib.Path(playwright.__file__).resolve().parent / "driver" / "package" / ".local-browsers")')"
          test -d "$BROWSERS"
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name WeChatArchiver --collect-all playwright --collect-all bs4 \
            --add-data "$BROWSERS:playwright_browsers" app.py
          test -d dist/WeChatArchiver.app
          ditto -c -k --sequesterRsrc --keepParent dist/WeChatArchiver.app "WeChatArchiver-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatArchiver-${{ matrix.label }}
          path: WeChatArchiver-${{ matrix.label }}.zip
